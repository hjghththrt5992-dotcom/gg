name: 一加平板 Pro 玩机内核

on:
  workflow_dispatch:
    inputs:
      android_ver:
        description: '平板当前系统的安卓大版本（设置 → 关于本机查看）'
        type: choice
        options: ['16', '15', '14']
        default: '16'
      ksu:
        description: '内置 KernelSU（关闭 = 通用内核，可配合 APatch / Magisk）'
        type: boolean
        default: true
      susfs:
        description: '集成 SUSFS 隐藏 root（需要 KernelSU）'
        type: boolean
        default: true
      opt:
        description: '社区调优补丁（内存/调度/文件系统/功耗）'
        type: boolean
        default: true
      bbr_default:
        description: '把 BBR/BBRv3 设为默认 TCP 拥塞控制'
        type: boolean
        default: false
      ntsync:
        description: 'NTSync（Wine/游戏兼容层）'
        type: boolean
        default: false
      containers:
        description: '容器支持（LXC / Docker / Podman）'
        type: boolean
        default: false
      abi_check:
        description: 'KMI 检查（多编一个官方基线核对接口，耗时约翻倍，建议保持开启）'
        type: boolean
        default: true
      pgo:
        description: 'PGO（用一加源码自带的真机性能数据优化编译）'
        type: boolean
        default: true
      lto:
        description: 'LTO 模式（full 加 PGO 链接时需要 16 GB 以上内存，GitHub 机器会爆内存，不建议）'
        type: choice
        options: [thin, full, none]
        default: thin
      o3:
        description: '用 -O3 编译（更激进）'
        type: boolean
        default: false
      ksu_ref:
        description: 'KernelSU 分支 / tag / commit'
        default: main
      susfs_ref:
        description: 'SUSFS 分支 / commit'
        default: gki-android14-6.1
      stock_boot_url:
        description: '可选：官方 boot.img 直链，填了会额外输出可 fastboot 刷入的 boot.img'
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@v6

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves cpio zip ccache

      - name: 恢复 ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-padpro-a${{ inputs.android_ver }}-${{ inputs.lto }}-${{ github.run_id }}
          restore-keys: ccache-padpro-a${{ inputs.android_ver }}-${{ inputs.lto }}-

      - name: 恢复 ABI 基线缓存
        uses: actions/cache@v6
        with:
          # 文件名里带内核源码 commit，一加更新源码后脚本会自动重编基线
          path: ${{ runner.temp }}/work/abi-baseline-*.symvers
          key: abi-baseline-a${{ inputs.android_ver }}-${{ inputs.lto }}-${{ github.run_id }}
          restore-keys: abi-baseline-a${{ inputs.android_ver }}-${{ inputs.lto }}-

      - name: 下载官方 boot.img
        if: inputs.stock_boot_url != ''
        env:
          STOCK_BOOT_URL: ${{ inputs.stock_boot_url }}
        run: curl -fL --retry 3 -o "$RUNNER_TEMP/stock-boot.img" "$STOCK_BOOT_URL"

      - name: 编译
        env:
          ANDROID_VER: ${{ inputs.android_ver }}
          KSU: ${{ inputs.ksu }}
          SUSFS: ${{ inputs.susfs }}
          OPT: ${{ inputs.opt }}
          BBR_DEFAULT: ${{ inputs.bbr_default }}
          NTSYNC: ${{ inputs.ntsync }}
          CONTAINERS: ${{ inputs.containers }}
          ABI_CHECK: ${{ inputs.abi_check }}
          LTO: ${{ inputs.lto }}
          PGO: ${{ inputs.pgo }}
          O3: ${{ inputs.o3 }}
          KSU_REF: ${{ inputs.ksu_ref }}
          SUSFS_REF: ${{ inputs.susfs_ref }}
          STOCK_BOOT: ${{ inputs.stock_boot_url != '' && format('{0}/stock-boot.img', runner.temp) || '' }}
          WORK_DIR: ${{ runner.temp }}/work
          OUT_DIR: ${{ github.workspace }}/dist
        run: bash oneplus-pad-pro-kernel/build.sh

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: OnePlusPadPro-A${{ inputs.android_ver }}-kernel-${{ github.run_number }}
          path: dist/
