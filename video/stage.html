<!doctype html>
<meta charset="utf-8">
<title>光标先生 stage</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Deterministic renderer: render(t) draws the frame at time t (seconds) from the event stream in TL.
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const MONO = '"WenQuanYi Zen Hei Mono","DejaVu Sans Mono",monospace';
const SANS = '"WenQuanYi Zen Hei","DejaVu Sans",sans-serif';
const EMOJI = '"Noto Color Emoji",sans-serif';
const FS = 56, LH = 80, X0 = 54, Y0 = 772, MAXROWS = 8;
const C = {
  green: '#7dff9b', amber: '#ffb52e', red: '#ff6b6b', cyan: '#6ce6ff',
  gray: '#7e8c82', white: '#e8fff0', dim: '#5f8f6b',
};
const FACE_DARK = '#2b1700';

let TL = null;
ctx.font = FS + 'px ' + MONO;
const CELL = ctx.measureText('M').width;            // one terminal column
const COLS = Math.floor((W - 2 * X0) / CELL);
const _cw = {};
function cellW(ch) {
  if (_cw[ch] === undefined) {
    ctx.font = FS + 'px ' + MONO;
    _cw[ch] = Math.max(1, Math.round(ctx.measureText(ch).width / CELL));
  }
  return _cw[ch];
}

function setTimeline(tl) {
  TL = tl;
  TL.events.sort((a, b) => a.t - b.t);
}

// ------------------------------------------------------------ state replay
function computeState(t) {
  const s = {
    lines: [], cur: [], prompt: '', promptColor: 'gray', curColor: 'green',
    face: 'idle', faceT: -9, arms: 'none', armsT: -9,
    lastKey: -9, lastShake: -9, shakeAmp: 0, lastClear: -9, lastFlash: -9,
    emojis: [], cursor: true, appearT: 1e9, fadeT: 1e9, fadeDur: 1, fadeTo: 0,
  };
  for (const e of TL.events) {
    if (e.t > t) break;
    switch (e.op) {
      case 'type': s.cur.push({ ch: e.ch, color: e.color || s.curColor }); s.lastKey = e.t; break;
      case 'bs': s.cur.pop(); s.lastKey = e.t; break;
      case 'nl':
        s.lines.push({ p: s.prompt, pc: s.promptColor, c: s.cur, t: e.t }); s.cur = []; s.lastKey = e.t; break;
      case 'print':
        s.lines.push({ p: '', pc: 'gray', c: [...e.text].map(ch => ({ ch, color: e.color })), t: e.t }); break;
      case 'undo': s.lines.splice(-e.n, e.n); s.lastClear = e.t - 0.02; break;
      case 'prompt': s.prompt = e.text; s.promptColor = e.color || 'gray'; break;
      case 'clear': s.lines = []; s.cur = []; s.emojis = []; s.lastClear = e.t; break;
      case 'face': s.face = e.v; s.faceT = e.t; break;
      case 'arms': s.arms = e.v; s.armsT = e.t; break;
      case 'shake': s.lastShake = e.t; s.shakeAmp = e.amp || 12; break;
      case 'flash': s.lastFlash = e.t; break;
      case 'emoji': s.emojis.push(e); break;
      case 'cursor': s.cursor = e.on; break;
      case 'appear': s.appearT = e.t; break;
      case 'fade': s.fadeT = e.t; s.fadeDur = e.dur; s.fadeTo = e.to; break;
    }
  }
  return s;
}

// ------------------------------------------------------------ helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// ------------------------------------------------------------ static layers
const scan = document.createElement('canvas'); scan.width = W; scan.height = H;
{
  const g = scan.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0.20)';
  for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 1.6);
  const rg = g.createRadialGradient(W / 2, H * 0.45, H * 0.28, W / 2, H * 0.45, H * 0.78);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,0.62)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
}
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
{
  const g = bg.getContext('2d');
  const lg = g.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, '#0b160f'); lg.addColorStop(1, '#040705');
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(125,255,155,0.06)';                 // faint pixel grid
  for (let y = 150; y < H; y += 60) for (let x = 30; x < W; x += 60) g.fillRect(x, y, 3, 3);
  const rg = g.createRadialGradient(W / 2, 420, 30, W / 2, 420, 420);
  rg.addColorStop(0, 'rgba(255,181,46,0.16)'); rg.addColorStop(1, 'rgba(255,181,46,0)');
  g.fillStyle = rg; g.fillRect(0, 110, W, 620);
}

// ------------------------------------------------------------ title bar
function drawTitle(t) {
  ctx.fillStyle = '#0f1811'; ctx.fillRect(0, 0, W, 110);
  ctx.fillStyle = '#1f2c22'; ctx.fillRect(0, 108, W, 2);
  ctx.fillStyle = C.amber; ctx.fillRect(0, 108, W * clamp(t / TL.duration), 3);
  [['#ff5f56', 62], ['#ffbd2e', 112], ['#27c93f', 162]].forEach(([c, x]) => {
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, 56, 15, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = C.gray; ctx.font = '34px ' + SANS; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('claude@手机 ~ 自我介绍.sh', 640, 58);
}

// ------------------------------------------------------------ mascot
function drawMascot(t, s, amp) {
  if (t < s.appearT) return;
  const age = t - s.appearT;
  const appear = easeOutBack(clamp(age / 0.45));
  const bw = 240, bh = 320, cx = 540, cy = 430;
  const bob = 10 * Math.sin(t * 2 * Math.PI / 2.6);
  let sx = 1, sy = 1;
  const k = clamp(1 - (t - s.lastKey) / 0.09);
  sy -= 0.035 * k; sx += 0.03 * k;
  const fa = t - s.faceT;
  const pop = 1 + 0.07 * Math.exp(-fa * 9) * Math.sin(fa * 30 + 1.2) * (fa >= 0 ? 1 : 0);
  let dx = 0;
  const sa = t - s.lastShake;
  if (sa >= 0 && sa < 0.9) dx = s.shakeAmp * Math.exp(-sa * 5) * Math.sin(sa * 62);

  // ground shadow
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(cx + dx, cy + bh * 0.56 + 58, 132 - bob * 1.2, 22 - bob * 0.25, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(cx + dx, cy + bob);
  const K = 1.12;
  ctx.scale(sx * appear * pop * K, sy * appear * pop * K);

  // arms (behind body)
  const ac = '#ffb52e';
  const arm = (x0, y0, x1, y1) => {
    ctx.strokeStyle = ac; ctx.lineWidth = 24; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(x1, y1, 24, 0, Math.PI * 2); ctx.fill();
  };
  if (s.arms === 'open') {
    const w = 12 * Math.sin(t * 5);
    arm(-bw / 2 + 6, 30, -bw / 2 - 78, -50 + w, 0);
    arm(bw / 2 - 6, 30, bw / 2 + 78, -50 - w, 0);
  } else if (s.arms === 'wave') {
    arm(-bw / 2 + 6, 60, -bw / 2 - 40, 110);
    const a = -1.05 + 0.4 * Math.sin(t * 10);
    arm(bw / 2 - 6, 30, bw / 2 - 6 + 120 * Math.cos(a), 30 + 120 * Math.sin(a));
  }

  // body
  ctx.shadowColor = 'rgba(255,170,40,0.55)'; ctx.shadowBlur = 50;
  const gr = ctx.createLinearGradient(0, -bh / 2, 0, bh / 2);
  gr.addColorStop(0, '#ffd166'); gr.addColorStop(1, '#ff9f1c');
  ctx.fillStyle = gr; rr(-bw / 2, -bh / 2, bw, bh, 56); ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 6;
  rr(-bw / 2 + 12, -bh / 2 + 12, bw - 24, bh - 24, 44); ctx.stroke();

  drawFace(t, s, amp);
  ctx.restore();
}

function drawFace(t, s, amp) {
  const ex = 54, ey = -50, f = s.face;
  const dark = FACE_DARK;
  const blink = (t % 3.4) < 0.12 ? 0.12 : 1;
  const eyeRect = (x, y, h, w = 34) => {
    ctx.fillStyle = dark; rr(x - w / 2, y - h / 2, w, h, w / 2); ctx.fill();
    if (h > 40) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - 6, y - h / 2 + 16, 7, 0, Math.PI * 2); ctx.fill(); }
  };
  const eyeArc = (x, y) => {
    ctx.strokeStyle = dark; ctx.lineWidth = 14; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, y + 22, 28, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
  };
  const eyeRound = (x, y, jit) => {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 34, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 6; ctx.stroke();
    ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(x + jit, y, 12, 0, Math.PI * 2); ctx.fill();
  };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // cheeks
  if (f === 'happy' || f === 'idle' || f === 'wink' || f === 'smug') {
    ctx.fillStyle = 'rgba(255,90,90,0.30)';
    ctx.beginPath(); ctx.ellipse(-96, 26, 24, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(96, 26, 24, 15, 0, 0, Math.PI * 2); ctx.fill();
  }

  // eyes
  if (f === 'happy') { eyeArc(-ex, ey); eyeArc(ex, ey); }
  else if (f === 'shock') { eyeRound(-ex, ey, Math.sin(t * 40) * 3); eyeRound(ex, ey, Math.sin(t * 40) * 3); }
  else if (f === 'smug') {
    [-ex, ex].forEach(x => {
      ctx.fillStyle = dark; rr(x - 19, ey - 8, 38, 50, 19); ctx.fill();
      ctx.strokeStyle = dark; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(x - 26, ey - 8); ctx.lineTo(x + 26, ey - 8); ctx.stroke();
      ctx.fillStyle = '#ffb52e'; ctx.fillRect(x - 24, ey - 22, 48, 14);
    });
  } else if (f === 'think') {
    eyeRect(-ex - 8, ey - 6, 84 * blink); eyeRect(ex - 8, ey - 6, 52 * blink);
    ctx.fillStyle = dark;
    for (let i = 0; i < 3; i++) {
      const a = 0.5 + 0.5 * Math.sin(t * 6 - i * 0.9);
      ctx.globalAlpha = 0.3 + 0.7 * a;
      ctx.beginPath(); ctx.arc(120 + i * 30, -150 - i * 12, 10, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if (f === 'wink') { eyeRect(-ex, ey, 80 * blink); eyeArc(ex, ey); }
  else if (f === 'sweat') {
    eyeRect(-ex + 8, ey, 70 * blink, 30); eyeRect(ex + 8, ey, 70 * blink, 30);
    const d = ((t - s.faceT) * 0.8) % 1;
    ctx.fillStyle = 'rgba(120,200,255,0.9)';
    ctx.beginPath(); const sx = 118, sy = -110 + d * 70;
    ctx.moveTo(sx, sy - 22); ctx.quadraticCurveTo(sx + 18, sy + 4, sx, sy + 14); ctx.quadraticCurveTo(sx - 18, sy + 4, sx, sy - 22); ctx.fill();
  } else { eyeRect(-ex, ey, 80 * blink); eyeRect(ex, ey, 80 * blink); }

  // mouth (lip-synced to the voice envelope)
  const talking = amp > 0.07 && f !== 'shock';
  ctx.strokeStyle = dark; ctx.fillStyle = dark; ctx.lineWidth = 10;
  if (f === 'shock') {
    ctx.beginPath(); ctx.ellipse(0, 70, 20, 26 + amp * 12, 0, 0, Math.PI * 2); ctx.fill();
  } else if (talking) {
    const h = 8 + amp * 40;
    ctx.beginPath(); ctx.ellipse(0, 56 + h / 3, 26, h / 2 + 4, 0, 0, Math.PI * 2); ctx.fill();
    if (h > 30) { ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.ellipse(0, 56 + h / 3 + h / 4, 15, h / 6, 0, 0, Math.PI * 2); ctx.fill(); }
  } else if (f === 'happy') {
    ctx.beginPath(); ctx.arc(0, 46, 34, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.ellipse(0, 72, 16, 9, 0, 0, Math.PI * 2); ctx.fill();
  } else if (f === 'think') {
    ctx.beginPath(); ctx.moveTo(-18, 66); ctx.lineTo(18, 60); ctx.stroke();
  } else if (f === 'smug') {
    ctx.beginPath(); ctx.moveTo(-26, 62); ctx.quadraticCurveTo(8, 80, 32, 50); ctx.stroke();
  } else if (f === 'sweat') {
    ctx.beginPath(); ctx.moveTo(-28, 66);
    for (let i = 1; i <= 4; i++) ctx.lineTo(-28 + i * 14, 66 + (i % 2 ? -8 : 6));
    ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(0, 44, 26, Math.PI * 0.18, Math.PI * 0.82); ctx.stroke();
  }
}

// ------------------------------------------------------------ terminal
function buildRows(s, t) {
  const rows = []; let cursor = null;
  const add = (line, isCur) => {
    const cells = [];
    for (const ch of [...line.p]) cells.push({ ch, color: C[line.pc], w: cellW(ch) });
    for (const c of line.c) cells.push({ ch: c.ch, color: C[c.color] || c.color, w: cellW(c.ch) });
    let row = { cells: [], age: isCur ? 99 : t - line.t }, col = 0;
    for (const c of cells) {
      if (col + c.w > COLS) { rows.push(row); row = { cells: [], age: row.age }; col = 0; }
      c.col = col; col += c.w; row.cells.push(c);
    }
    if (isCur) {
      if (col + 1 > COLS) { rows.push(row); row = { cells: [], age: 99 }; col = 0; }
      cursor = { col, row: rows.length };
    }
    rows.push(row);
  };
  for (const l of s.lines) add(l, false);
  add({ p: s.prompt, pc: s.promptColor, c: s.cur }, true);
  return { rows, cursor };
}

function drawTerminal(t, s) {
  const { rows, cursor } = buildRows(s, t);
  const start = Math.max(0, rows.length - MAXROWS);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = FS + 'px ' + MONO;
  rows.slice(start).forEach((row, i) => {
    const a = clamp(row.age / 0.12), y = Y0 + i * LH + 60 + (1 - a) * 10;
    ctx.globalAlpha = a;
    for (const c of row.cells) {
      ctx.shadowColor = c.color; ctx.shadowBlur = 14; ctx.fillStyle = c.color;
      ctx.fillText(c.ch, X0 + c.col * CELL, y);
    }
    ctx.globalAlpha = 1;
  });
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  if (s.cursor && cursor && cursor.row >= start) {
    const idle = t - s.lastKey > 0.3;
    if (!idle || Math.floor(t * 2) % 2 === 0) {
      const x = X0 + cursor.col * CELL, y = Y0 + (cursor.row - start) * LH;
      ctx.shadowColor = C.amber; ctx.shadowBlur = 18; ctx.fillStyle = C.amber;
      ctx.fillRect(x + 1, y + 6, CELL - 3, 68);
      ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
    }
  }
}

function drawEmojis(t, s) {
  for (const e of s.emojis) {
    const a = t - e.t; if (a < 0) continue;
    const sc = easeOutBack(clamp(a / 0.35));
    ctx.save(); ctx.translate(e.x, e.y + 10 * Math.sin(t * 3 + e.x));
    ctx.scale(sc, sc); ctx.rotate(0.12 * Math.sin(t * 2.4 + e.x));
    ctx.font = e.size + 'px ' + EMOJI; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(e.ch, 0, 0); ctx.restore();
  }
}

// ------------------------------------------------------------ subtitles (karaoke-style)
function drawSubs(t) {
  const sub = TL.subs.find(g => t >= g.start - 0.02 && t < g.end + 0.35);
  if (!sub) return;
  const fs = 54, maxW = 900, lh = 80;
  ctx.font = 'bold ' + fs + 'px ' + SANS;
  const chars = [];
  sub.parts.forEach((p, pi) => { for (const ch of [...p.text]) chars.push({ ch, pi }); });
  const noStart = '，。？！：、；）」』”…';
  // Break preferably at punctuation: a phrase is kept whole unless it is wider than a line.
  // Inside an over-long phrase, an ASCII word stays whole and everything else is one glyph.
  const brk = '，。？！：；、';
  for (const c of chars) c.w = ctx.measureText(c.ch).width;
  const phrases = []; let ph = [];
  for (const c of chars) { ph.push(c); if (brk.includes(c.ch)) { phrases.push(ph); ph = []; } }
  if (ph.length) phrases.push(ph);
  const sum = cs => cs.reduce((a, c) => a + c.w, 0);
  const glyphUnits = cs => {
    const us = [];
    for (const c of cs) {
      const word = /[A-Za-z0-9_.]/.test(c.ch), last = us[us.length - 1];
      if (word && last && last.word) { last.cs.push(c); last.w += c.w; } else us.push({ cs: [c], w: c.w, word });
    }
    return us;
  };
  const units = [];
  for (const p of phrases) {
    if (sum(p) <= maxW) units.push({ cs: p, w: sum(p) });
    else units.push(...glyphUnits(p));
  }
  const wrap = limit => {
    const out = []; let ln = [], w = 0;
    for (const u of units) {
      if (w + u.w > limit && ln.length && !brk.includes(u.cs[0].ch)) { out.push(ln); ln = []; w = 0; }
      ln.push(...u.cs); w += u.w;
    }
    if (ln.length) out.push(ln);
    return out;
  };
  const total = sum(chars);
  const need = Math.max(1, Math.ceil(total / maxW));
  let lines = wrap(maxW);
  if (need > 1) {                      // even out the lines so no orphan glyphs are left behind
    const bal = wrap(total / need + fs * 1.2);
    if (bal.length <= lines.length) lines = bal;
  }
  const appear = clamp((t - (sub.start - 0.02)) / 0.12);
  const top = 1655 - (lines.length * lh) / 2 + (1 - appear) * 12;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.lineJoin = 'round';
  ctx.globalAlpha = appear * (1 - clamp((t - sub.end) / 0.3));
  lines.forEach((ln, li) => {
    const total = ln.reduce((a, c) => a + c.w, 0);
    let x = (W - total) / 2; const y = top + li * lh + lh / 2;
    for (const c of ln) {
      const p = sub.parts[c.pi];
      const active = t >= p.s && t < p.e + 0.04;
      const done = t >= p.e + 0.04;
      ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.strokeText(c.ch, x, y);
      ctx.fillStyle = active ? '#ffc83d' : (done ? '#ffffff' : 'rgba(255,255,255,0.5)');
      if (active) { ctx.shadowColor = 'rgba(255,181,46,0.8)'; ctx.shadowBlur = 16; }
      ctx.fillText(c.ch, x, y); ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
      x += c.w;
    }
  });
  ctx.globalAlpha = 1;
}

// ------------------------------------------------------------ frame
function render(t) {
  const s = computeState(t);
  const amp = (TL.amp[Math.floor(t * TL.fps)] || 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.drawImage(bg, 0, 0);
  drawTitle(t);
  drawEmojis(t, s);
  drawMascot(t, s, amp);
  drawTerminal(t, s);

  // CRT look over the screen, then crisp subtitles on top
  ctx.drawImage(scan, 0, 0);
  const fl = t - s.lastFlash;
  if (fl >= 0 && fl < 0.25) { ctx.fillStyle = `rgba(125,255,155,${0.16 * (1 - fl / 0.25)})`; ctx.fillRect(0, 110, W, H - 110); }
  ctx.fillStyle = `rgba(255,255,255,${0.012 * Math.sin(t * 95) + 0.012})`; ctx.fillRect(0, 0, W, H);
  drawSubs(t);

  // scene-change glitch
  const ga = t - s.lastClear;
  if (ga >= 0 && ga < 0.2) {
    const fr = Math.floor(t * TL.fps);
    for (let i = 0; i < 6; i++) {
      const y = 120 + hash(fr * 7 + i) * (H - 400), h = 30 + hash(fr * 13 + i) * 110;
      const dx = (hash(fr * 3 + i) - 0.5) * 120 * (1 - ga / 0.2);
      ctx.drawImage(cv, 0, y, W, h, dx, y, W, h);
    }
  }
  // fade to black
  const fd = clamp((t - s.fadeT) / s.fadeDur);
  if (fd > 0) { ctx.fillStyle = `rgba(0,0,0,${fd * s.fadeTo})`; ctx.fillRect(0, 0, W, H); }
}
</script>
